spring.application.name=hoas
server.port=8080

# Credentials are read from environment variables, or from a local .env file (KEY=value lines, gitignored).
spring.config.import=optional:file:.env[.properties]
hoas.base-url=https://booking-hoas.tampuuri.fi
hoas.username=${HOAS_USERNAME:}
hoas.password=${HOAS_PASSWORD:}

# API key every MCP client must send (Authorization: Bearer <key>). Required: the server will not start without it.
hoas.mcp.api-key=${HOAS_MCP_API_KEY:}
# Behind the reverse proxy: trust X-Forwarded-* so logs show the real client address
server.forward-headers-strategy=native

spring.ai.mcp.server.name=hoas-booking
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.instructions=Tools for the HOAS booking service (booking-hoas.tampuuri.fi): laundry machines, dryers and saunas. \
Call list_services first to discover service ids, then get_timetable to see free slots and machine ids, then reserve_slot. \
Always confirm with the user before reserving.
